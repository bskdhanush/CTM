name: Build EXE

on:
  push:
    branches: [ main ]  # Trigger only when pushing to main branch

jobs:
  build:
    runs-on: windows-latest  # Use Windows since we want a Windows .exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile main_GUI.py  # You can change this to your script

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v3
        with:
          name: Built-Executable
          path: dist/main.exe  # The output from PyInstaller
