name: Building and Release EXE

on:
  push:
    tags:
      - 'v*'  # Triggers only when pushing tags like v1.0.0

jobs:
  build:
    runs-on: windows-latest  # Windows machine needed to build .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile main_GUI.py  # Replace with your entry script

      - name: Create GitHub Release and Upload EXE
        uses: softprops/action-gh-release@v1
        with:
          files: dist/main_GUI.exe  # This is where PyInstaller puts the .exe
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
